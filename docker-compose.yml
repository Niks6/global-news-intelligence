# ============================================================
# Global News Intelligence — 3-Node Cluster (Docker)
# ============================================================
# Simulates a 3-node distributed cluster:
#   Node 1 (Master):  ZooKeeper, Kafka-1, NameNode, HBase Master,
#                      Spark Master, Backend, Frontend
#   Node 2 (Worker1): Kafka-2, DataNode-1, Spark Worker-1
#   Node 3 (Worker2): Kafka-3, DataNode-2, Spark Worker-2
#
# Prerequisites:
#   - Docker Desktop with WSL2, 8GB+ memory allocated
#   - Create ~/.wslconfig with [wsl2] memory=10GB
#   - Restart Docker Desktop after changing .wslconfig
#
# Usage:
#   docker compose up -d
#   docker compose logs -f backend
#   docker compose down -v   (removes volumes too)
# ============================================================

services:

  # ====================== NODE 1 — MASTER ======================

  # --- ZooKeeper (Node 1) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: gnip-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx96m -Xms32m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,srvr"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    networks:
      cluster-net:
        aliases: [zookeeper]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Kafka Broker 1 (Node 1) ---
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gnip-kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      cluster-net:
        aliases: [kafka-1]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 75s

  # --- HDFS NameNode (Node 1) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: gnip-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: gnip-cluster
      HADOOP_HEAPSIZE: "128"
      HADOOP_OPTS: "-Xmx128m -Xms48m -XX:+UseSerialGC"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      cluster-net:
        aliases: [namenode]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- HBase (Standalone mode on Node 1 — includes Master + RegionServer + Thrift) ---
  hbase-master:
    image: harisekhon/hbase:latest
    container_name: gnip-hbase-master
    hostname: hbase-master
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
      - "9090:9090"
      - "8085:8085"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed -i 's/-XX:+UseConcMarkSweepGC/-XX:+UseSerialGC/g' /hbase/conf/hbase-env.sh
        sed -i 's/^    start_stargate$$/    # start_stargate/' /entrypoint.sh
        exec /entrypoint.sh
    environment:
      JAVA_HOME: /usr
      HBASE_HEAPSIZE: 96m
      HBASE_ZOOKEEPER_OPTS: "-Xmx48m -Xms16m"
      HBASE_MASTER_OPTS: "-Xmx160m -Xms48m"
      HBASE_REGIONSERVER_OPTS: "-Xmx192m -Xms48m"
      HBASE_THRIFT_OPTS: "-Xmx128m -Xms48m"
    volumes:
      - hbase_data:/hbase-data
      - hbase_zk:/tmp/hbase-root
    stop_grace_period: 30s
    networks:
      cluster-net:
        aliases: [hbase-master, hbase]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && exec 3<>/dev/tcp/127.0.0.1/16010"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --- Spark Master (Node 1) ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: gnip-spark-master
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8082:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: "96m"
      SPARK_DAEMON_JAVA_OPTS: "-XX:+UseSerialGC"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    entrypoint: []
    networks:
      cluster-net:
        aliases: [spark-master]
    restart: unless-stopped

  # ====================== NODE 2 — WORKER 1 ======================

  # --- Kafka Broker 2 (Node 2) ---
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gnip-kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      cluster-net:
        aliases: [kafka-2]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 75s

  # --- HDFS DataNode 1 (Node 2) ---
  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: gnip-datanode-1
    hostname: datanode-1
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_datanode_data_dir: /hadoop/dfs/data
      HDFS_CONF_dfs_permissions_enabled: "false"
      HADOOP_HEAPSIZE: "128"
      HADOOP_OPTS: "-Xmx128m -Xms48m -XX:+UseSerialGC"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    networks:
      cluster-net:
        aliases: [datanode-1]
    restart: unless-stopped

  # --- Spark Worker 1 (Node 2) ---
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: gnip-spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: "96m"
      SPARK_DAEMON_JAVA_OPTS: "-XX:+UseSerialGC"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    entrypoint: []
    networks:
      cluster-net:
        aliases: [spark-worker-1]
    restart: unless-stopped

  # ====================== NODE 3 — WORKER 2 ======================

  # --- Kafka Broker 3 (Node 3) ---
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gnip-kafka-3
    hostname: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
      - "29094:29094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      cluster-net:
        aliases: [kafka-3]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 75s

  # --- HDFS DataNode 2 (Node 3) ---
  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: gnip-datanode-2
    hostname: datanode-2
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_datanode_data_dir: /hadoop/dfs/data
      HDFS_CONF_dfs_permissions_enabled: "false"
      HADOOP_HEAPSIZE: "128"
      HADOOP_OPTS: "-Xmx128m -Xms48m -XX:+UseSerialGC"
    volumes:
      - datanode2_data:/hadoop/dfs/data
    networks:
      cluster-net:
        aliases: [datanode-2]
    restart: unless-stopped

  # --- Spark Worker 2 (Node 3) ---
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: gnip-spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_DAEMON_MEMORY: "96m"
      SPARK_DAEMON_JAVA_OPTS: "-XX:+UseSerialGC"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    entrypoint: []
    networks:
      cluster-net:
        aliases: [spark-worker-2]
    restart: unless-stopped

  # ====================== APPLICATION SERVICES ======================

  # --- Kafka Topic Creator (runs once) ---
  kafka-setup:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gnip-kafka-setup
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka cluster...' && sleep 5 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.events.raw --partitions 3 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.mentions.raw --partitions 3 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.gkg.raw --partitions 3 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.events.normalized --partitions 3 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.analytics --partitions 3 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic gdelt.dead-letter --partitions 1 --replication-factor 2 &&
      echo '=== Kafka Topics Created ===' &&
      kafka-topics --bootstrap-server kafka-1:9092 --list
      "
    networks:
      - cluster-net
    restart: "no"

  # --- HBase Table Init (runs after HBase is healthy) ---
  hbase-init:
    image: harisekhon/hbase:latest
    container_name: gnip-hbase-init
    depends_on:
      hbase-master:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat > /hbase/conf/hbase-site.xml <<'EOF'
        <configuration>
          <property>
            <name>hbase.zookeeper.quorum</name>
            <value>hbase-master:2181</value>
          </property>
        </configuration>
        EOF
        echo 'Creating HBase tables...'
        /hbase/bin/hbase shell -n <<'HBASE_EOF'
        begin create 'events_by_id', {NAME => 'event', VERSIONS => 1, TTL => 31536000, BLOOMFILTER => 'ROW'}, {NAME => 'meta', VERSIONS => 1, TTL => 31536000}; rescue => e; puts e.message; end
        begin create 'events_by_country_time', {NAME => 'data', VERSIONS => 1, TTL => 31536000, BLOOMFILTER => 'ROW'}; rescue => e; puts e.message; end
        begin create 'topic_metrics_by_time', {NAME => 'metrics', VERSIONS => 3, TTL => 7776000}; rescue => e; puts e.message; end
        begin create 'country_metrics_by_time', {NAME => 'metrics', VERSIONS => 3, TTL => 7776000}; rescue => e; puts e.message; end
        begin create 'category_metrics_by_time', {NAME => 'metrics', VERSIONS => 3, TTL => 7776000}; rescue => e; puts e.message; end
        begin create 'anomalies_by_time', {NAME => 'alert', VERSIONS => 1, TTL => 2592000}; rescue => e; puts e.message; end
        list
        exit
        HBASE_EOF
        echo 'HBase init done'
    networks:
      - cluster-net
    restart: "no"

  # --- Backend API (Node 1) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gnip-backend
    hostname: backend
    depends_on:
      - kafka-1
      - hbase-master
      - namenode
    ports:
      - "8000:8000"
    volumes:
      - pipeline_data:/app/data
    environment:
      PYTHONPATH: /app
      HBASE_HOST: hbase-master
      HBASE_THRIFT_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      HDFS_NAMENODE_HOST: namenode
      HDFS_NAMENODE_PORT: 9000
      HDFS_NAMENODE_URL: hdfs://namenode:9000
      HDFS_WEBHDFS_URL: http://namenode:9870
      SPARK_MASTER: spark://spark-master:7077
      HBASE_ZOOKEEPER_QUORUM: zookeeper
      FRONTEND_URL: http://localhost:5173
      GDELT_CHECKPOINT_DB: /app/data/checkpoints/ingestion.db
      GDELT_METRICS_FILE: /app/data/metrics/ingestion_metrics.json
      GDELT_PROCESSING_METRICS_FILE: /app/data/metrics/processing_metrics.json
      LOG_LEVEL: INFO
    networks:
      cluster-net:
        aliases: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- GDELT Ingestion Worker (Node 1) ---
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gnip-ingestion
    hostname: ingestion
    user: "0:0"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "src.ingestion.cli", "poll", "--interval", "15"]
    volumes:
      - pipeline_data:/app/data
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      POLL_INTERVAL_MINUTES: "15"
      GDELT_DOWNLOAD_DIR: /app/data/raw
      GDELT_CHECKPOINT_DB: /app/data/checkpoints/ingestion.db
      GDELT_DEAD_LETTER_DIR: /app/data/dead_letter
      GDELT_METRICS_FILE: /app/data/metrics/ingestion_metrics.json
      LOG_LEVEL: INFO
    healthcheck:
      disable: true
    networks:
      cluster-net:
        aliases: [ingestion]
    restart: unless-stopped

  # --- Distributed Spark Pipeline Worker (Node 2/3 Executors) ---
  spark-pipeline:
    build:
      context: .
      dockerfile: infrastructure/spark/Dockerfile
    container_name: gnip-spark-pipeline
    hostname: spark-pipeline
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      hbase-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      spark-master:
        condition: service_started
    volumes:
      - pipeline_data:/app/data
    environment:
      PYTHONPATH: /app
      SRC_ROOT: /app
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: spark-pipeline
      SPARK_DRIVER_MEMORY: 500m
      SPARK_EXECUTOR_MEMORY: 500m
      SPARK_CORES_MAX: "1"
      SPARK_POLL_SECONDS: "30"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      HDFS_NAMENODE_URL: hdfs://namenode:9000
      HBASE_HOST: hbase-master
      HBASE_THRIFT_PORT: "9090"
      GDELT_PROCESSING_METRICS_FILE: /app/data/metrics/processing_metrics.json
    healthcheck:
      disable: true
    networks:
      cluster-net:
        aliases: [spark-pipeline]
    restart: unless-stopped

  # --- Frontend (Node 1) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gnip-frontend
    hostname: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      cluster-net:
        aliases: [frontend]
    restart: unless-stopped

  # ====================== OPTIONAL DEV TOOLS ======================

  # Kafka UI — http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gnip-kafka-ui
    depends_on:
      - kafka-1
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gnip-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - cluster-net
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  zk_data:
  zk_logs:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  namenode_data:
  datanode1_data:
  datanode2_data:
  hbase_data:
  hbase_zk:
  pipeline_data:

networks:
  cluster-net:
    name: gnip-cluster-network
    driver: bridge
